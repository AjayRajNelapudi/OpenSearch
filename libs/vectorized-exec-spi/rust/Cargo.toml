[package]
name = "vectorized-exec-spi"
version = "0.1.0"
edition = "2021"
description = "Shared Rust utilities for OpenSearch vectorized execution"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
jni = "0.21"
prost = "0.14"
tokio = { version = "1.0", features = ["rt"] }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]

